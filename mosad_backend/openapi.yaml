openapi: 3.0.3
info:
  title: Mosad Backend API
  version: 1.0.0
  description: API for authenticating users

servers:
  - url: https://313dce28-5c14-4990-8e70-661764f55665-dev.e1-us-east-azure.choreoapis.dev/mosad-deploying/mosadbackend/v1.0

paths:
  /api/v1/login:
    post:
      summary: User Login
      operationId: loginUser
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  format: password
                  example: admin123
      parameters:
        - name: Test-Key
          in: header
          required: true
          schema:
            type: string
          description: API key for authentication
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                example:
                  token: your.jwt.token.here
        '401':
          description: Invalid credentials
        '403':
          description: Forbidden — insufficient permissions or CORS issue
        '500':
          description: Server error

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Test-Key

security:
  - ApiKeyAuth: []
