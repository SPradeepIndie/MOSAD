name: React App Build

on: 
  push:
    branches: [ "developer-*" ]
  pull_request:
    branches: [ "develop","master"]
    types: [opened,reoponed,synchronize]

jobs:
  build:
    name: build_react_app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: npm_install_dependencies
        run: npm install
        working-directory: ./mosad_frontend
      - name: Generate .env file
        run: |
          echo "VITE_API_URL=${{env.VITE_DEV_API_URL}}" > .env.development
          echo "VITE_API_URL=${{env.VITE_PROD_API_URL}}" > .env.prodcution
     
      - name: npm_build
        run: npm run build
        working-directory: ./mosad_frontend
      
